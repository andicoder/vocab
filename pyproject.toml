[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-api"
version = "0.3.0rc3"
description = "Self-hosted vocab + translator service for the family"
requires-python = ">=3.12"
authors = [{ name = "andicoder", email = "3944775+andicoder@users.noreply.github.com" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "edge-tts>=7.0",
    "aioboto3>=13.2",
    "anki>=25.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocab_api = ["templates/**/*.html", "locales/*.json", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Size-limit rules are documented in CLAUDE.md under "Code size limits".
# - PLR0913: max function arguments (default max-args=5). Bundle related
#   collaborators into dataclasses or pydantic models.
# - PLR0915: max statements per function (override below to 30). Body > 30
#   statements almost always means the function is doing more than one thing.
# - PLR0911/PLR0912: max return points / branches per function. Defaults.
# - C901: max cyclomatic complexity (default 10).
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.lint.per-file-ignores]
# FastAPI route handlers receive their dependencies as parameters — that is the
# framework's intended pattern, so the param-count rule does not apply there.
"src/vocab_api/routes/*.py" = ["PLR0913"]
# Test fixtures sometimes need many setup args; keeping tests readable trumps
# the rule. Tests also exercise branchy fixture builders; we trust readability
# of the test body over the strict complexity ceiling for non-production code.
"tests/*.py" = ["PLR0913", "PLR0911", "PLR0912", "PLR0915", "C901"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Surface the 10 slowest tests on every run so a slow test is visible
# from the regular output instead of needing a flag. Cheap to compute
# and reading "0.4s setup foo" is enough to flag a fixture pollution.
addopts = "--durations=10"

[[tool.mypy.overrides]]
module = ["aioboto3", "aioboto3.*", "anki", "anki.*"]
ignore_missing_imports = true
