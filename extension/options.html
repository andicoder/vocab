<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>vocab — Optionen</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 1rem; min-width: 340px; }
        label { display: block; margin: .5rem 0 .15rem; font-size: .9rem; font-weight: 500; }
        input { width: 100%; padding: .5rem; box-sizing: border-box;
                font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        .section { border-top: 1px solid #e5e7eb; margin-top: 1rem; padding-top: .75rem; }
        .section-title { font-size: .8rem; font-weight: 600; color: #6b7280;
                         text-transform: uppercase; letter-spacing: .05em; margin-bottom: .5rem; }
        button { margin-top: .75rem; padding: .5rem 1rem; cursor: pointer;
                 background: #2563eb; color: white; border: 0; border-radius: 4px; }
        button.secondary { background: #f3f4f6; color: #111827; border: 1px solid #d1d5db; }
        .status { margin-top: .5rem; font-size: .85rem; color: #065f46; }
        .auth-status { margin-top: .5rem; font-size: .85rem; padding: .4rem .6rem;
                       border-radius: 4px; background: #f3f4f6; }
        .auth-status.logged-in { background: #d1fae5; color: #065f46; }
        .auth-status.logged-out { background: #fee2e2; color: #991b1b; }
        .redirect-url { font-size: .78rem; color: #6b7280; margin-top: .5rem;
                        word-break: break-all; }
        .redirect-url code { background: #f3f4f6; padding: .1rem .3rem; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="section-title" style="margin-top:0">API</div>
    <label for="apiBaseUrl">API-URL</label>
    <input id="apiBaseUrl" type="url" placeholder="https://vocab.example.com">

    <div class="section">
        <div class="section-title">Authentik OIDC</div>
        <label for="oidcIssuer">Issuer URL</label>
        <input id="oidcIssuer" type="url" placeholder="https://auth.example.com/application/o/vocab-extension/">
        <label for="oidcClientId">Client ID</label>
        <input id="oidcClientId" type="text" placeholder="vocab-extension">
        <div class="redirect-url">
            Redirect URL for Authentik config: <code id="redirectUrl">loading…</code>
        </div>
        <div id="authStatus" class="auth-status logged-out">Not logged in</div>
        <button id="loginBtn" type="button">Login with Authentik</button>
        <button id="logoutBtn" type="button" class="secondary" style="margin-left:.5rem">Logout</button>
    </div>

    <div class="section">
        <button id="save" type="button">Save settings</button>
        <div id="status" class="status"></div>
    </div>
    <script src="options.js"></script>
</body>
</html>
