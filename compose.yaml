services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: vocab
      POSTGRES_DB: vocab
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab -d vocab"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - vocab-pg:/var/lib/postgresql/data

volumes:
  vocab-pg:
